[project]
name = "macdash"
version = "0.1.0"
description = "Web dashboard to monitor and control a headless Mac"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
]

[project.scripts]
macdash = "macdash.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
